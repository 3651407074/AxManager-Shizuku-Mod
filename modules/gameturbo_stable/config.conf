# GameTurbo 配置（改完重装或重启插件生效）
# MODE: safe | balanced | beast
#   safe     只切游戏模式，不动频率、不锁刷新率
#   balanced 游戏模式 + 锁高刷（默认，推荐）
#   beast    再加固定性能模式；Root 下还会满频
MODE=balanced

# FPS: auto | 60 | 90 | 120 | 144
#   锁定的刷新率上限；auto = 用系统默认
FPS=auto

# 额外按"游戏"处理的包名，空格分隔（留空 = 只认系统标记为 game 的应用）
EXTRA_GAMES=

# 前台检测间隔（秒）
INTERVAL=5

# 系统没把游戏标成 game 类型时（国行 ROM 常见），是否按包名猜一把
#   1 = 开（tmgp / mihoyo / netease / pubg ... 这类关键词）
#   0 = 关（默认，只用 EXTRA_GAMES 和系统分类）
HEURISTIC=0
